name: 🛒 쇼피 상품글 미리보기

# products.csv 를 읽어 국가별 판매가 + AI 상품글을 만들고 결과 파일을 아티팩트로 남긴다.
# 실제 업로드(--live)는 토큰 갱신 저장 문제로 아직 로컬에서만 실행한다 (shopee/README.md 참고).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "처리할 상품 수 (0 = 전체)"
        required: false
        default: "0"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r shopee/requirements.txt
      - run: python -m pytest shopee/tests -q
      - name: 상품글 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: python -m shopee.run_pipeline --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-listings
          path: shopee/output/
