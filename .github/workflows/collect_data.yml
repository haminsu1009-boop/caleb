name: 📥 전체 데이터 수집 (BTC + ETH + ALT + 외부지표)

on:
  workflow_dispatch:

permissions:
  contents: write

# 재사용 push 스크립트 — 매 retry에서 fetch→rebase→push 수행
# random jitter로 여러 job이 동시에 충돌하는 것을 방지
env:
  BRANCH: claude/quant-trading-bot-tkjtd

jobs:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # BTC — 고속 봉 (병렬, 타임아웃 40분)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  btc-fast:
    name: "BTC ${{ matrix.interval }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        interval: ["1mo","1w","3d","1d","12h","6h","4h","2h","1h","30m","15m"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests
      - run: python bybit/collect_history.py --symbol BTCUSDT --interval ${{ matrix.interval }}
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/BTCUSDT_${{ matrix.interval }}_*.csv.gz 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 BTC ${{ matrix.interval }} 수집 완료"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # BTC 5m (별도 — 60분 타임아웃)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  btc-5m:
    name: "BTC 5m"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests
      - run: python bybit/collect_history.py --symbol BTCUSDT --interval 5m
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/BTCUSDT_5m_*.csv.gz 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 BTC 5m 수집 완료"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # BTC 3m
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  btc-3m:
    name: "BTC 3m"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests
      - run: python bybit/collect_history.py --symbol BTCUSDT --interval 3m
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/BTCUSDT_3m_*.csv.gz 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 BTC 3m 수집 완료"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # BTC 1m (최대 3시간)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  btc-1m:
    name: "BTC 1m"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests
      - run: python bybit/collect_history.py --symbol BTCUSDT --interval 1m
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/BTCUSDT_1m_*.csv.gz 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 BTC 1m 수집 완료"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ETH — 주요 타임프레임
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  eth:
    name: "ETH ${{ matrix.interval }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        interval: ["1d","4h","1h","15m","5m","1m"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests
      - run: python bybit/collect_history.py --symbol ETHUSDT --interval ${{ matrix.interval }}
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/ETHUSDT_${{ matrix.interval }}_*.csv.gz 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 ETH ${{ matrix.interval }} 수집 완료"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 알트코인 — BNB / SOL / XRP / ADA
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  alt:
    name: "${{ matrix.symbol }} ${{ matrix.interval }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        symbol:   ["BNBUSDT","SOLUSDT","XRPUSDT","ADAUSDT"]
        interval: ["1d","4h","1h","5m"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests
      - run: python bybit/collect_history.py --symbol ${{ matrix.symbol }} --interval ${{ matrix.interval }}
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/${{ matrix.symbol }}_${{ matrix.interval }}_*.csv.gz 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 ${{ matrix.symbol }} ${{ matrix.interval }} 수집 완료"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 외부 지표 14종
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  indicators:
    name: "📊 외부 지표 14종"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests pytrends yfinance
      - run: python bybit/collect_indicators.py
      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/indicators/ 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 외부 지표 수집 완료 (14종)"
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((RANDOM % 20 + i * 4))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 완료 요약
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  summary:
    name: "✅ 전체 완료"
    runs-on: ubuntu-latest
    needs: [btc-fast, btc-5m, btc-3m, btc-1m, eth, alt, indicators]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          fetch-depth: 0
      - name: 수집 결과 요약
        run: |
          echo "================================================"
          echo "  📦 BTC OHLCV ($(ls data/BTCUSDT_*.csv.gz 2>/dev/null | wc -l)개 파일)"
          ls -lh data/BTCUSDT_*.csv.gz 2>/dev/null | awk '{print "  "$5"\t"$9}' || echo "  없음"
          echo ""
          echo "  📦 ETH OHLCV ($(ls data/ETHUSDT_*.csv.gz 2>/dev/null | wc -l)개 파일)"
          ls -lh data/ETHUSDT_*.csv.gz 2>/dev/null | awk '{print "  "$5"\t"$9}' || echo "  없음"
          echo ""
          echo "  📦 알트코인 OHLCV"
          ls -lh data/BNB*.csv.gz data/SOL*.csv.gz data/XRP*.csv.gz data/ADA*.csv.gz 2>/dev/null | awk '{print "  "$5"\t"$9}' || echo "  없음"
          echo ""
          echo "  📊 외부 지표 ($(ls data/indicators/*.csv 2>/dev/null | wc -l)개 파일)"
          ls -lh data/indicators/*.csv 2>/dev/null | awk '{print "  "$5"\t"$9}' || echo "  없음"
          echo ""
          echo "  💾 총 용량"
          du -sh data/ 2>/dev/null
          echo "================================================"
