name: 🚀 선물데이터+재학습+패턴분석 v2

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "심볼 (공백 구분)"
        required: false
        default: "BTCUSDT ETHUSDT BNBUSDT ADAUSDT SOLUSDT XRPUSDT"
      from_year:
        description: "데이터 시작 연도"
        required: false
        default: "2021"
      skip_retrain:
        description: "재학습 건너뛰기"
        required: false
        default: "false"
      fast:
        description: "fast mode"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch-futures:
    name: "📡 선물 데이터 수집"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - name: 선물 데이터 수집
        run: |
          mkdir -p data/futures
          for SYM in ${{ github.event.inputs.symbols }}; do
            echo "▶ $SYM"
            python ml/fetch_futures_data.py --symbol "$SYM" --from_year ${{ github.event.inputs.from_year }} || echo "⚠️ $SYM 실패"
          done
      - name: 코드 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/futures/ 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "📡 선물 데이터 수집"
          for i in $(seq 1 5); do
            sleep $((i*3))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  retrain:
    name: "🤖 ${{ matrix.symbol }} 재학습"
    needs: fetch-futures
    if: ${{ github.event.inputs.skip_retrain != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        symbol: ${{ fromJson(needs.fetch-futures.outputs.symbol_matrix || '["BTCUSDT","ETHUSDT","BNBUSDT","ADAUSDT","SOLUSDT","XRPUSDT"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy scikit-learn xgboost lightgbm matplotlib requests
      - name: 봉단위 결정
        id: intervals
        run: |
          SYM="${{ matrix.symbol }}"
          if [ "$SYM" = "BTCUSDT" ] || [ "$SYM" = "ETHUSDT" ]; then
            echo "intervals=1m 5m 1h 4h 1d" >> $GITHUB_OUTPUT
          else
            echo "intervals=5m 1h 4h 1d" >> $GITHUB_OUTPUT
          fi
      - name: 재학습 (Y1-Y15 포함)
        run: |
          FAST_FLAG=""
          [ "${{ github.event.inputs.fast }}" = "true" ] && FAST_FLAG="--fast"
          SYM="${{ matrix.symbol }}"
          BASE_FROM=${{ github.event.inputs.from_year }}
          for IV in ${{ steps.intervals.outputs.intervals }}; do
            FROM_YEAR=$BASE_FROM
            [ "$IV" = "1m" ] && FROM_YEAR=2023
            [ "$IV" = "5m" ] && [ "$BASE_FROM" -lt "2022" ] && FROM_YEAR=2022
            echo "▶ $SYM $IV"
            python ml/train_directional.py --symbol "$SYM" --interval "$IV" --from $FROM_YEAR $FAST_FLAG || echo "⚠️ $SYM $IV 실패"
          done
      - name: 모델 코드 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add ml/saved_models/ charts/ 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "🤖 재학습 완료 ${{ matrix.symbol }} (Y1-Y15)"
          for i in $(seq 1 10); do
            sleep $((RANDOM%20 + i*5))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

  pattern-analysis:
    name: "🔍 패턴 분석"
    needs: [fetch-futures, retrain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - run: git pull origin claude/quant-trading-bot-tkjtd
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy scikit-learn xgboost lightgbm matplotlib requests
      - name: 패턴 분석
        run: python ml/pattern_analysis.py
      - name: 결과 코드 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add charts/pattern_report.html ml/saved_models/pattern_rules.csv 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "🔍 패턴 분석 완료 (294+피처)"
          for i in $(seq 1 5); do
            sleep $((i*3))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done
      - name: 요약
        if: always()
        run: |
          # ⚠️ 인라인 python3 -c 의 본문이 1열에서 시작해 YAML 블록 스칼라가
          #   거기서 끊겼다. 이 워크플로가 21회 연속 즉시 실패한 원인.
          #   → 히어독으로 바꾸고 전체를 run 블록 들여쓰기 안에 둔다.
          python3 <<'PY' || echo "요약 실패"
          import os
          import pandas as pd

          path = "ml/saved_models/pattern_rules.csv"
          if os.path.exists(path):
              df = pd.read_csv(path)
              print(f"총 룰: {len(df)}개  "
                    f"WR100%: {(df.win_rate == 100).sum()}개  "
                    f"WR90%+: {(df.win_rate >= 90).sum()}개")
              print(df.sort_values("win_rate", ascending=False)
                      .head(5).to_string(index=False))
          else:
              print("pattern_rules.csv 없음")
          PY
