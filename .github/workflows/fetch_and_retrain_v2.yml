name: "🚀 전타임프레임수집+선물데이터+재학습+패턴분석 v3"

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "심볼 (공백 구분, 비워두면 전체 15개)"
        required: false
        default: "BTCUSDT ETHUSDT BNBUSDT ADAUSDT SOLUSDT XRPUSDT DOGEUSDT DOTUSDT AVAXUSDT MATICUSDT LINKUSDT LTCUSDT UNIUSDT ATOMUSDT NEARUSDT"
      timeframes:
        description: "타임프레임 (비워두면 1m제외 전체: 3m 5m 15m 30m 1h 2h 4h 6h 12h 1d 3d 1w 1mo)"
        required: false
        default: ""
      from_year:
        description: "재학습 시작 연도"
        required: false
        default: "2019"
      skip_collect:
        description: "OHLCV 수집 건너뛰기 (true/false)"
        required: false
        default: "false"
      skip_retrain:
        description: "재학습 건너뛰기 (true/false)"
        required: false
        default: "false"
      fast:
        description: "fast mode (true/false)"
        required: false
        default: "false"
      missing_only:
        description: "누락 데이터만 수집 (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  run-all:
    name: "📡 전TF수집 → 선물 → 🤖 재학습 → 🔍 분석"
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install pandas numpy scikit-learn xgboost lightgbm matplotlib requests

      - name: "📊 STEP0 - 전 타임프레임 OHLCV 수집 (Binance 공개 API)"
        if: ${{ github.event.inputs.skip_collect != 'true' }}
        run: |
          mkdir -p data

          # 타임프레임 인수 처리
          TF_ARGS=""
          if [ -n "${{ github.event.inputs.timeframes }}" ]; then
            TF_ARGS="--timeframes ${{ github.event.inputs.timeframes }}"
          fi

          # missing-only 처리
          MISSING_FLAG=""
          if [ "${{ github.event.inputs.missing_only }}" = "true" ]; then
            MISSING_FLAG="--missing-only"
          fi

          # 심볼별 수집
          python ml/collect_all_timeframes.py \
            --symbols ${{ github.event.inputs.symbols }} \
            $TF_ARGS \
            $MISSING_FLAG \
            || echo "⚠️ 일부 수집 실패 (계속 진행)"

          echo "=== 수집된 OHLCV 파일 (상위 30개) ==="
          ls -lh data/*.csv.gz 2>/dev/null | head -30 || echo "파일 없음"
          echo "=== 전체 데이터 용량 ==="
          du -sh data/*.csv.gz 2>/dev/null | tail -1 || true

      - name: "📡 STEP1 - Bybit 선물 데이터 수집 (펀딩비+OI+LSR)"
        run: |
          mkdir -p data/futures
          for SYM in ${{ github.event.inputs.symbols }}; do
            echo "▶ $SYM 선물 수집 중 (Bybit API)..."
            python ml/fetch_futures_data.py --symbol "$SYM" --from_year ${{ github.event.inputs.from_year }} || echo "⚠️ $SYM 실패"
          done
          echo "수집된 선물 파일:"
          ls -lh data/futures/ 2>/dev/null || echo "선물 파일 없음"

      - name: "🤖 STEP2 - 재학습 (전 심볼 × 핵심 타임프레임)"
        if: ${{ github.event.inputs.skip_retrain != 'true' }}
        run: |
          FAST_FLAG=""
          if [ "${{ github.event.inputs.fast }}" = "true" ]; then FAST_FLAG="--fast"; fi

          for SYM in ${{ github.event.inputs.symbols }}; do
            for IV in 5m 15m 1h 4h 1d; do
              echo "▶ $SYM $IV 재학습"
              python ml/train_directional.py --symbol "$SYM" --interval "$IV" --from ${{ github.event.inputs.from_year }} $FAST_FLAG || echo "⚠️ $SYM $IV 실패"
            done
          done

      - name: "🔍 STEP3 - 패턴 분석"
        run: python ml/pattern_analysis.py

      - name: "💾 결과 저장"
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/ ml/saved_models/ charts/ 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🤖 전TF수집+재학습+패턴분석 완료"
          for i in 1 2 3 4 5; do
            sleep $((i * 5))
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

      - name: "📊 결과 요약"
        if: always()
        run: |
          echo "=== OHLCV 데이터 현황 ==="
          python ml/collect_all_timeframes.py --coverage 2>/dev/null || true

          echo ""
          echo "=== 선물 데이터 ==="
          ls -lh data/futures/ 2>/dev/null || echo "없음"

          echo ""
          echo "=== 패턴 룰 ==="
          RULES_FILE="ml/saved_models/pattern_rules.csv"
          if [ -f "$RULES_FILE" ]; then
            TOTAL=$(awk 'END{print NR-1}' "$RULES_FILE")
            echo "총 룰: ${TOTAL}개"
            head -11 "$RULES_FILE"
          else
            echo "패턴 룰 파일 없음"
          fi

          echo ""
          echo "=== 총 데이터 용량 ==="
          du -sh data/ 2>/dev/null || true
