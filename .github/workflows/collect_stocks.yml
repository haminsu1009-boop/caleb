name: 📈 미국 주식 데이터 수집

# yfinance는 개발 세션의 프록시에서 403으로 막히지만 GitHub 러너에서는
# 정상 동작한다. 그래서 주식 데이터 수집은 여기서만 돌린다.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "데이터를 커밋할 브랜치"
        default: "claude/quant-trading-bot-tkjtd"
      universe:
        description: "수집 대상 (all / sp100 / etf)"
        default: "all"
      start:
        description: "수집 시작일"
        default: "2000-01-01"
  schedule:
    - cron: "0 7 * * 1"      # 매주 월요일 07:00 UTC

permissions:
  contents: write

concurrency:
  group: collect-stocks-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: ${{ github.event.inputs.branch || 'claude/quant-trading-bot-tkjtd' }}

jobs:
  collect:
    name: "수집 ${{ matrix.universe }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1          # 같은 브랜치에 푸시하므로 순차 실행
      matrix:
        universe: [etf, sp100]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install yfinance pandas

      - name: 수집
        run: |
          python stocks/collect_us.py \
            --universe ${{ matrix.universe }} \
            --start ${{ github.event.inputs.start || '2000-01-01' }}

      - name: 커버리지 요약
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, os
          import pandas as pd

          files = sorted(glob.glob("data/stocks/*_1d.csv.gz"))
          print(f"### ${{ matrix.universe }} — {len(files)}개 파일")
          print()
          print("| 종목 | 행수 | 시작 | 종료 |")
          print("|---|---|---|---|")
          for f in files[:25]:
              d = pd.read_csv(f, compression="gzip")
              if d.empty:
                  continue
              t = os.path.basename(f).replace("_1d.csv.gz", "")
              print(f"| {t} | {len(d):,} | {d['datetime'].iloc[0][:10]} | {d['datetime'].iloc[-1][:10]} |")
          if len(files) > 25:
              print(f"| ... | 외 {len(files)-25}개 | | |")
          PY

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks/ || true
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: refresh US ${{ matrix.universe }} through $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin $TARGET_BRANCH && \
            git push origin HEAD:$TARGET_BRANCH && break || sleep $((i*6))
          done
