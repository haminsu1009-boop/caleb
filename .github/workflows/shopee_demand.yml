name: 🛒 쇼피 수요 조사 (주간)

on:
  schedule:
    - cron: "17 0 * * 1"   # 매주 월요일 09:17 KST
  workflow_dispatch:
    inputs:
      markets:
        description: "국가 (쉼표 구분, 비우면 config 의 활성 국가 전체)"
        required: false
        default: ""
      category:
        description: "관심 카테고리 (예: beauty, snacks)"
        required: false
        default: ""

jobs:
  demand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r shopee/requirements.txt
      - name: 수요 조사 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKETS: ${{ inputs.markets }}
          CATEGORY: ${{ inputs.category }}
        run: |
          if [ -n "$MARKETS" ]; then
            python -m shopee.demand --markets "$MARKETS" --category "$CATEGORY"
          else
            python -m shopee.demand --category "$CATEGORY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-demand
          path: shopee/output/
