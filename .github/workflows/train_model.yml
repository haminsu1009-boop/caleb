name: 🤖 ML 전체 학습 (심볼 병렬)

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "fast mode — TemporalXGB 스킵 (true/false)"
        required: false
        default: "false"
      from_year:
        description: "데이터 시작 연도 (예: 2020)"
        required: false
        default: "2020"
      symbols:
        description: "학습 심볼 (공백 구분, 예: BTCUSDT ETHUSDT, 기본=전체)"
        required: false
        default: "BTCUSDT ETHUSDT BNBUSDT ADAUSDT SOLUSDT XRPUSDT"

permissions:
  contents: write

jobs:
  # ── 심볼 목록 파싱 ──────────────────────────────────────
  setup:
    name: "설정"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          SYMBOLS="${{ github.event.inputs.symbols }}"
          JSON=$(python3 -c "
import json, sys
s = '$SYMBOLS'.split()
print(json.dumps(s))
")
          echo "matrix={\"symbol\":$JSON}" >> $GITHUB_OUTPUT

  # ── 심볼별 병렬 학습 ──────────────────────────────
  train:
    name: "🤖 ${{ matrix.symbol }}"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quant-trading-bot-tkjtd
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: 패키지 설치
        run: |
          pip install pandas numpy scikit-learn xgboost lightgbm matplotlib

      - name: 봉 단위 결정 (${{ matrix.symbol }})
        id: intervals
        run: |
          SYM="${{ matrix.symbol }}"
          if [ "$SYM" = "BTCUSDT" ] || [ "$SYM" = "ETHUSDT" ]; then
            echo "intervals=5m 1h 4h 1d" >> $GITHUB_OUTPUT
          else
            echo "intervals=1h 4h 1d" >> $GITHUB_OUTPUT
          fi

      - name: ML 학습 & 워크포워드 백테스트
        run: |
          FAST_FLAG=""
          if [ "${{ github.event.inputs.fast }}" = "true" ]; then
            FAST_FLAG="--fast"
          fi

          SYM="${{ matrix.symbol }}"
          INTERVALS="${{ steps.intervals.outputs.intervals }}"

          echo "##################################################"
          echo "  심볼: $SYM"
          echo "  봉단위: $INTERVALS"
          echo "  fast: ${{ github.event.inputs.fast }}"
          echo "##################################################"

          for IV in $INTERVALS; do
            echo ""
            echo "=========================================="
            echo "  ▶ $SYM  $IV  학습 시작"
            echo "=========================================="
            python ml/train_directional.py \
              --symbol "$SYM" \
              --interval "$IV" \
              --from ${{ github.event.inputs.from_year }} \
              $FAST_FLAG || {
              echo "⚠️  $SYM $IV 학습 실패 — 다음으로 계속"
              continue
            }
          done

      - name: 결과 저장 (모델 + 차트 + CSV)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add ml/saved_models/ charts/ 2>/dev/null || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🤖 학습 완료 — ${{ matrix.symbol }} (fast=${{ github.event.inputs.fast }})"
          for i in $(seq 1 10); do
            SLEEP=$((RANDOM % 20 + i * 5))
            sleep $SLEEP
            git fetch origin claude/quant-trading-bot-tkjtd
            git rebase origin/claude/quant-trading-bot-tkjtd || { git rebase --abort; continue; }
            git push origin claude/quant-trading-bot-tkjtd && break || true
          done

      - name: 결과 요약
        if: always()
        run: |
          echo "================================================"
          echo "  ${{ matrix.symbol }} 모델:"
          ls -lh ml/saved_models/directional_${{ matrix.symbol }}_*.pkl 2>/dev/null || echo "  없음"
          echo ""
          echo "  차트:"
          ls -lh charts/directional_bt_${{ matrix.symbol }}_*.png 2>/dev/null || echo "  없음"
          echo "================================================"
