# 쇼피 자동화 설정
#
# ⚠️ verified: false 인 동안에는 --live 업로드가 막혀 있습니다.
#    아래 수수료·배송비는 "예시값"입니다. 쇼피코리아 요율표(셀러센터 / 담당 AM 안내)로
#    실제 값을 채운 뒤 verified: true 로 바꾸세요.
verified: false

# 가격 정책
pricing:
  target_margin_rate: 0.20      # 판매가 대비 목표 마진 (20%)
  min_profit_krw: 3000          # 마진율과 별개로 건당 최소 이익
  fx_buffer_rate: 0.03          # 환율 변동 대비 버퍼 (원화 원가를 3% 높게 잡음)
  fx_api: "https://open.er-api.com/v6/latest/KRW"   # 무료 환율 API (키 불필요)

# 무재고(주문 후 구매) 운영 — 주문 후 국내 구매·입고까지 걸리는 일수
fulfillment:
  pre_order: true
  days_to_ship: 7               # 쇼피 국가/카테고리별 허용 범위 확인 필요
  default_stock: 50             # 노출용 가상 재고 수량

# AI 상품글 생성
ai:
  model: "claude-opus-5-5"
  effort: "medium"

# 판매 국가 — enabled: false 로 끄면 해당 국가는 건너뜀
# fee 항목(예시값): commission_rate=판매수수료, transaction_fee_rate=결제수수료,
#                   service_fee_rate=프로그램(무료배송·캐시백 등) 수수료
# ship_*: 셀러가 부담하는 국제 배송비(원화 환산, 예시값)
markets:
  SG:
    enabled: true
    currency: SGD
    language: en
    price_step: 0.1
    commission_rate: 0.10
    transaction_fee_rate: 0.03
    service_fee_rate: 0.0
    ship_base_krw: 3000
    ship_per_100g_krw: 700
    fx_fallback: 1050          # 1 SGD = ? KRW (환율 API 실패 시 사용)
  MY:
    enabled: true
    currency: MYR
    language: en
    price_step: 0.1
    commission_rate: 0.10
    transaction_fee_rate: 0.03
    service_fee_rate: 0.0
    ship_base_krw: 3000
    ship_per_100g_krw: 700
    fx_fallback: 320
  PH:
