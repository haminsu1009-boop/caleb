<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- globe -->
  <g transform="translate(430,300)">
    <circle r="190" fill="url(#globeGrad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <ellipse rx="190" ry="60" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <ellipse rx="190" ry="120" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse rx="60" ry="190" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse rx="120" ry="190" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- route arcs -->
  <g stroke-width="2.5" fill="none" stroke-dasharray="3 7">
    <path d="M260 200 Q 430 90 590 170" stroke="#ffffff" stroke-opacity="0.55"/>
    <path d="M300 420 Q 430 320 560 410" stroke="#ffffff" stroke-opacity="0.55"/>
    <path d="M250 320 Q 410 230 610 300" stroke="#9c3459" stroke-opacity="0.7"/>
  </g>

  <!-- nodes -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="260" cy="200" r="5"/>
    <circle cx="590" cy="170" r="5"/>
    <circle cx="300" cy="420" r="5"/>
    <circle cx="560" cy="410" r="5"/>
  </g>
  <g fill="#9c3459">
    <circle cx="250" cy="320" r="7"/>
    <circle cx="610" cy="300" r="7"/>
  </g>

  <!-- plane along the red route -->
  <g transform="translate(430,255) rotate(-12)">
    <path d="M0 0 L34 4 L42 0 L34 -4 Z M14 -2 L4 -16 L10 -16 L20 -3 Z M14 2 L4 16 L10 16 L20 3 Z" fill="#ffffff" fill-opacity="0.95"/>
  </g>
</svg>
