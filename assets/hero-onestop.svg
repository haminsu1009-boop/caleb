<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- soft glow behind hub -->
  <circle cx="580" cy="300" r="190" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="580" cy="300" r="130" fill="#ffffff" fill-opacity="0.06"/>

  <!-- connector lines from satellite modes into the hub -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="3 8" fill="none">
    <path d="M480 410 Q 520 370 558 340"/>
    <path d="M700 230 Q 650 270 600 290"/>
    <path d="M700 410 Q 650 370 605 335"/>
  </g>

  <!-- central warehouse / hub building -->
  <g transform="translate(580,300)">
    <path d="M-100 30 L0 -70 L100 30 V100 H-100 Z" fill="#ffffff" fill-opacity="0.97"/>
    <path d="M-100 30 L0 -70 L100 30 L80 30 L0 -42 L-80 30 Z" fill="#9c3459" fill-opacity="0.9"/>
    <rect x="-66" y="40" width="40" height="60" rx="3" fill="#9c3459" fill-opacity="0.85"/>
    <rect x="-10" y="40" width="40" height="40" rx="3" fill="#31589b" fill-opacity="0.85"/>
    <rect x="46" y="40" width="40" height="60" rx="3" fill="#31589b" fill-opacity="0.85"/>
  </g>

  <!-- ship badge -->
  <g transform="translate(460,420)">
    <circle r="40" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-20 6 H20 L13 20 Q0 25 -13 20 Z" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="-10" y="-9" width="9" height="14" rx="1" fill="#9c3459"/>
    <rect x="2" y="-9" width="9" height="14" rx="1" fill="#31589b"/>
  </g>

  <!-- plane badge -->
  <g transform="translate(700,225) rotate(18)">
    <circle r="40" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" transform="rotate(-18)"/>
    <path d="M-24 0 L18 4 L25 0 L18 -4 Z M2 -2 L-7 -15 L-1 -15 L7 -3 Z M2 2 L-7 15 L-1 15 L7 3 Z" fill="#ffffff" fill-opacity="0.95"/>
  </g>

  <!-- truck badge -->
  <g transform="translate(700,415)">
    <circle r="40" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="-24" y="-9" width="32" height="20" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M8 -9 H22 L28 0 V11 H8 Z" fill="#9c3459" fill-opacity="0.9"/>
    <circle cx="-13" cy="13" r="5.5" fill="#22406e"/>
    <circle cx="17" cy="13" r="5.5" fill="#22406e"/>
  </g>
</svg>
