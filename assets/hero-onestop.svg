<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- orbit ring -->
  <circle cx="420" cy="300" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 9"/>
  <circle cx="420" cy="300" r="60" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- center package -->
  <g transform="translate(420,300)">
    <rect x="-28" y="-24" width="56" height="48" rx="4" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M-28 -8 H28 M0 -24 V24" stroke="#9c3459" stroke-width="4"/>
  </g>

  <!-- ship icon (left) -->
  <g transform="translate(230,210)">
    <circle r="44" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M-22 6 H22 L14 22 Q0 28 -14 22 Z" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="-12" y="-10" width="10" height="16" rx="1" fill="#9c3459"/>
    <rect x="2" y="-10" width="10" height="16" rx="1" fill="#31589b"/>
  </g>

  <!-- plane icon (top right) -->
  <g transform="translate(560,190) rotate(20)">
    <circle r="44" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" transform="rotate(-20)"/>
    <path d="M-26 0 L20 4 L28 0 L20 -4 Z M2 -2 L-8 -16 L-2 -16 L8 -3 Z M2 2 L-8 16 L-2 16 L8 3 Z" fill="#ffffff" fill-opacity="0.95"/>
  </g>

  <!-- truck icon (bottom) -->
  <g transform="translate(380,420)">
    <circle r="44" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="-26" y="-10" width="34" height="22" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M8 -10 H24 L30 0 V12 H8 Z" fill="#9c3459" fill-opacity="0.9"/>
    <circle cx="-14" cy="14" r="6" fill="#22406e"/>
    <circle cx="18" cy="14" r="6" fill="#22406e"/>
  </g>

  <!-- warehouse icon (right) -->
  <g transform="translate(560,390)">
    <circle r="44" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M-24 4 L0 -16 L24 4 V22 H-24 Z" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="-8" y="6" width="16" height="16" fill="#31589b"/>
  </g>
</svg>
