<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Crimson T: horizontal bars (perspective stack effect) -->
  <rect x="8"  y="8"  width="120" height="12" fill="#8C1A50"/>
  <rect x="8"  y="23" width="116" height="12" fill="#8C1A50"/>
  <rect x="8"  y="38" width="112" height="12" fill="#8C1A50"/>
  <rect x="8"  y="53" width="96"  height="12" fill="#8C1A50"/>
  <rect x="8"  y="68" width="92"  height="12" fill="#8C1A50"/>
  <rect x="8"  y="83" width="88"  height="12" fill="#8C1A50"/>
