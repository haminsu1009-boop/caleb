  <rect x="18" y="166" width="78"  height="12" fill="#1A4AB0"/>
  <rect x="18" y="181" width="72"  height="12" fill="#1A4AB0"/>
  <!-- Blue T: right arm -->
  <polygon points="118,106 156,106 167,121 129,121" fill="#1A4AB0"/>
  <polygon points="129,121 167,121 176,146 138,146" fill="#1A4AB0"/>
</svg>
